name: Flicksta Testing
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      SECRET_KEY: secret_key
      ENCRYPT_KEY: mKJKI2CP4Nta3OmVMAV9aW6MOH43VHxaCfPGWdHg6R4=
      CLOUDINARY_URL: https://api.cloudinary.com/v1_1/demo/image/upload
      AWS_S3_ACCESS_KEY_ID: DEMO_ACCESS_KEY_ID
      AWS_S3_SECRET_ACCESS_KEY: DEMO_SECRET_ACCESS_KEY
      AWS_STORAGE_BUCKET_NAME: flicksta-test-bucket
      AWS_S3_REGION_NAME: us-east-1
      

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11.3"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py test
